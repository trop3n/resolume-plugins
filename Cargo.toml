[workspace]
resolver = "2"
# One folder per plugin. Add new plugins here.
members = [
    "crates/ffgl-fx",
    "plugins/ascii",
    "plugins/cctv",
    "plugins/datamosh",
    "plugins/depth-map",
    "plugins/dither",
    "plugins/dot-matrix",
    "plugins/edge-detect",
    "plugins/halftone",
    "plugins/mosaic-tiles",
    "plugins/night-vision",
    "plugins/pixel-sort",
    "plugins/posterize",
    "plugins/retro-lcd",
    "plugins/risograph",
    "plugins/rusci-scope",
    "plugins/solarize",
    "plugins/teletext",
    "plugins/thermal",
    "plugins/threshold",
    "plugins/tracking",
    "plugins/x-ray",
    "tools/fx-host",
]

# Windows cargo can't create incremental-compilation lock files on a WSL
# (\\wsl.localhost) path. Builds are small, so turn incremental off.
[profile.dev]
incremental = false
