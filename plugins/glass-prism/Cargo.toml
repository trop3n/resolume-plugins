[package]
name = "glass-prism"
description = "Glass Prism: View the video through patterned glass (reeded, fluted, frosted, liquid, bubble, ripple, hammered, lenticular) (FFGL effect for Resolume)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Used by scripts/bundle-macos.sh and install.ps1 at the repo root.
[package.metadata.resolume]
# Installed file name: GlassPrism.dll / GlassPrism.bundle
file-name = "GlassPrism"

[lib]
name = "glass_prism"
crate-type = ["cdylib", "rlib"]

[dependencies]
ffgl-fx = { path = "../../crates/ffgl-fx" }
