[package]
name = "halftone"
description = "Halftone: Rotated halftone screen of dots, lines or squares, mono or CMYK (FFGL effect for Resolume)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Used by scripts/bundle-macos.sh and install.ps1 at the repo root.
[package.metadata.resolume]
# Installed file name: Halftone.dll / Halftone.bundle
file-name = "Halftone"

[lib]
name = "halftone"
crate-type = ["cdylib", "rlib"]

[dependencies]
ffgl-fx = { path = "../../crates/ffgl-fx" }
