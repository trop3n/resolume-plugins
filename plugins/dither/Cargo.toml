[package]
name = "dither"
description = "Dither: Bayer or noise dithering to a few levels at a chosen pixel size (FFGL effect for Resolume)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Used by scripts/bundle-macos.sh and install.ps1 at the repo root.
[package.metadata.resolume]
# Installed file name: Dither.dll / Dither.bundle
file-name = "Dither"

[lib]
name = "dither"
crate-type = ["cdylib", "rlib"]

[dependencies]
ffgl-fx = { path = "../../crates/ffgl-fx" }
