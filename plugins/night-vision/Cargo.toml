[package]
name = "night-vision"
description = "Night Vision: Amplified green phosphor image with noise, bloom and vignette (FFGL effect for Resolume)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Used by scripts/bundle-macos.sh and install.ps1 at the repo root.
[package.metadata.resolume]
# Installed file name: NightVision.dll / NightVision.bundle
file-name = "NightVision"

[lib]
name = "night_vision"
crate-type = ["cdylib", "rlib"]

[dependencies]
ffgl-fx = { path = "../../crates/ffgl-fx" }
