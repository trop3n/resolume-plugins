[package]
name = "blur-prism"
description = "Blur Prism: Directional motion-style blur inside a box/ellipse area or a luma/alpha/color key (FFGL effect for Resolume)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Used by scripts/bundle-macos.sh and install.ps1 at the repo root.
[package.metadata.resolume]
# Installed file name: BlurPrism.dll / BlurPrism.bundle
file-name = "BlurPrism"

[lib]
name = "blur_prism"
crate-type = ["cdylib", "rlib"]

[dependencies]
ffgl-fx = { path = "../../crates/ffgl-fx" }
