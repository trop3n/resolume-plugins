[package]
name = "bar-mosaic"
description = "Bar Mosaic: Rows of lit bars whose edges bend with the image (FFGL effect for Resolume)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Used by scripts/bundle-macos.sh and install.ps1 at the repo root.
[package.metadata.resolume]
# Installed file name: BarMosaic.dll / BarMosaic.bundle
file-name = "BarMosaic"

[lib]
name = "bar_mosaic"
crate-type = ["cdylib", "rlib"]

[dependencies]
ffgl-fx = { path = "../../crates/ffgl-fx" }
