[package]
name = "mosaic-tiles"
description = "Mosaic Tiles: Grid of tiles flipping between the image and a solid colour (FFGL effect for Resolume)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Used by scripts/bundle-macos.sh and install.ps1 at the repo root.
[package.metadata.resolume]
# Installed file name: MosaicTiles.dll / MosaicTiles.bundle
file-name = "MosaicTiles"

[lib]
name = "mosaic_tiles"
crate-type = ["cdylib", "rlib"]

[dependencies]
ffgl-fx = { path = "../../crates/ffgl-fx" }
