[package]
name = "pixel-sort"
description = "Pixel Sort: GPU pixel sorting FFGL effect for Resolume"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Used by scripts/bundle-macos.sh and install.ps1 at the repo root.
[package.metadata.resolume]
# Installed file name: PixelSort.dll / PixelSort.bundle
file-name = "PixelSort"

[lib]
name = "pixel_sort"
crate-type = ["cdylib", "rlib"]

[dependencies]
ffgl-fx = { path = "../../crates/ffgl-fx" }
