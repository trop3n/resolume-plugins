[package]
name = "ripple-prism"
description = "Ripple Prism: Ripple distortion spreading from a movable center (circular, linear waves, droplet, standing wave) (FFGL effect for Resolume)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Used by scripts/bundle-macos.sh and install.ps1 at the repo root.
[package.metadata.resolume]
# Installed file name: RipplePrism.dll / RipplePrism.bundle
file-name = "RipplePrism"

[lib]
name = "ripple_prism"
crate-type = ["cdylib", "rlib"]

[dependencies]
ffgl-fx = { path = "../../crates/ffgl-fx" }
