[package]
name = "risograph"
description = "Risograph: two-ink riso print FFGL effect for Resolume"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Used by scripts/bundle-macos.sh and install.ps1 at the repo root.
[package.metadata.resolume]
# Installed file name: Risograph.dll / Risograph.bundle
file-name = "Risograph"

[lib]
name = "risograph"
crate-type = ["cdylib", "rlib"]

[dependencies]
ffgl-fx = { path = "../../crates/ffgl-fx" }
