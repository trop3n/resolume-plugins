[package]
name = "threshold"
description = "Threshold: Hard two-colour cut at a brightness level, with photocopy grit (FFGL effect for Resolume)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Used by scripts/bundle-macos.sh and install.ps1 at the repo root.
[package.metadata.resolume]
# Installed file name: Threshold.dll / Threshold.bundle
file-name = "Threshold"

[lib]
name = "threshold"
crate-type = ["cdylib", "rlib"]

[dependencies]
ffgl-fx = { path = "../../crates/ffgl-fx" }
