[package]
name = "datamosh"
description = "Datamosh: Fake codec datamosh: old frames smeared along the clip's block motion (FFGL effect for Resolume)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Used by scripts/bundle-macos.sh and install.ps1 at the repo root.
[package.metadata.resolume]
# Installed file name: Datamosh.dll / Datamosh.bundle
file-name = "Datamosh"

[lib]
name = "datamosh"
crate-type = ["cdylib", "rlib"]

[dependencies]
ffgl-fx = { path = "../../crates/ffgl-fx" }
