[package]
name = "retro-lcd"
description = "Retro LCD: Low-res two-tone phone LCD with dither and a pixel grid (FFGL effect for Resolume)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Used by scripts/bundle-macos.sh and install.ps1 at the repo root.
[package.metadata.resolume]
# Installed file name: RetroLCD.dll / RetroLCD.bundle
file-name = "RetroLCD"

[lib]
name = "retro_lcd"
crate-type = ["cdylib", "rlib"]

[dependencies]
ffgl-fx = { path = "../../crates/ffgl-fx" }
