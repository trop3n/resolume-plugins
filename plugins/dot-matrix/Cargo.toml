[package]
name = "dot-matrix"
description = "Dot Matrix: Grid of dots sized by brightness, printer or LED style (FFGL effect for Resolume)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Used by scripts/bundle-macos.sh and install.ps1 at the repo root.
[package.metadata.resolume]
# Installed file name: DotMatrix.dll / DotMatrix.bundle
file-name = "DotMatrix"

[lib]
name = "dot_matrix"
crate-type = ["cdylib", "rlib"]

[dependencies]
ffgl-fx = { path = "../../crates/ffgl-fx" }
