[package]
name = "ascii"
description = "ASCII: Redraws the clip as text characters or shade blocks (FFGL effect for Resolume)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Used by scripts/bundle-macos.sh and install.ps1 at the repo root.
[package.metadata.resolume]
# Installed file name: ASCII.dll / ASCII.bundle
file-name = "ASCII"

[lib]
name = "ascii"
crate-type = ["cdylib", "rlib"]

[dependencies]
ffgl-fx = { path = "../../crates/ffgl-fx" }
