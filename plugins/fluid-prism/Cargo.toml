[package]
name = "fluid-prism"
description = "Fluid Prism: Smoke-like fluid distortion that swirls the video out of an emitter, with chromatic dispersion (in the style of the Hiss effect from Control) (FFGL effect for Resolume)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Used by scripts/bundle-macos.sh and install.ps1 at the repo root.
[package.metadata.resolume]
# Installed file name: FluidPrism.dll / FluidPrism.bundle
file-name = "FluidPrism"

[lib]
name = "fluid_prism"
crate-type = ["cdylib", "rlib"]

[dependencies]
ffgl-fx = { path = "../../crates/ffgl-fx" }
