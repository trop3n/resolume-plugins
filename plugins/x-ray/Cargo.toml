[package]
name = "x-ray"
description = "X-Ray: Inverted, high-contrast x-ray with glowing edges, grain and scan lines (FFGL effect for Resolume)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Used by scripts/bundle-macos.sh and install.ps1 at the repo root.
[package.metadata.resolume]
# Installed file name: XRay.dll / XRay.bundle
file-name = "XRay"

[lib]
name = "x_ray"
crate-type = ["cdylib", "rlib"]

[dependencies]
ffgl-fx = { path = "../../crates/ffgl-fx" }
