[package]
name = "teletext"
description = "Teletext: Ceefax-style mosaic blocks in the eight teletext colours (FFGL effect for Resolume)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Used by scripts/bundle-macos.sh and install.ps1 at the repo root.
[package.metadata.resolume]
# Installed file name: Teletext.dll / Teletext.bundle
file-name = "Teletext"

[lib]
name = "teletext"
crate-type = ["cdylib", "rlib"]

[dependencies]
ffgl-fx = { path = "../../crates/ffgl-fx" }
