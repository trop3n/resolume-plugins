[package]
name = "cctv"
description = "CCTV: Cheap security camera: soft, tinted, noisy, with jitter, scan lines and a REC dot (FFGL effect for Resolume)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Used by scripts/bundle-macos.sh and install.ps1 at the repo root.
[package.metadata.resolume]
# Installed file name: CCTV.dll / CCTV.bundle
file-name = "CCTV"

[lib]
name = "cctv"
crate-type = ["cdylib", "rlib"]

[dependencies]
ffgl-fx = { path = "../../crates/ffgl-fx" }
