[package]
name = "thermal"
description = "Thermal: Thermal-camera false colour: iron, rainbow, white hot or black hot (FFGL effect for Resolume)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Used by scripts/bundle-macos.sh and install.ps1 at the repo root.
[package.metadata.resolume]
# Installed file name: Thermal.dll / Thermal.bundle
file-name = "Thermal"

[lib]
name = "thermal"
crate-type = ["cdylib", "rlib"]

[dependencies]
ffgl-fx = { path = "../../crates/ffgl-fx" }
